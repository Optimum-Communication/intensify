# yaml-language-server: $schema=https://raw.githubusercontent.com/Optimum-Communication/intensify/main/spec/v1.0/schema.json
#
# Intensify spec: the intent graph of this repository.
# Reference: https://github.com/Optimum-Communication/intensify/blob/main/spec/v1.0/spec.md
intensify: "1.0"

project:
  id: intensify
  name: "Intensify"

config:
  analyze:
    depth: function  # finest node kind `intensify analyze` creates: module | class | function
    public_only: true  # skip private symbols
    exclude:
      - tests/fixtures/  # sample repositories for the analyzers, not project code
      - tests/golden/
  verify:
    test_command: "uv run pytest -q {tests}"
  drift:
    fail_on: [undocumented_edge, contract_mismatch, invariant_violation, missing_node]

nodes:
  - id: intensify
    kind: repo
    lifecycle_state: active
    intent:
      summary: "Open-source CLI and specification for recording, analyzing and enforcing the intent of a codebase as a graph in intensify.yaml."
  - id: intensify-module
    kind: module
    parent_id: intensify
    lifecycle_state: active
    provenance: analyzed
    intent:
      summary: 'The intensify Python package: the CLI, the spec library, analyzers, merge, drift, agent context and the MCP server.'
      author: ai
    technical:
      language: python
      location: {path: src/intensify/__init__.py}
      complexity: {loc: 6}
      fingerprint: sha256:78b56462b871f95ea080e336d2ef17153f41eb1d2d1004764a5bb350bfd2d9d7
  - id: intensify.__main__
    kind: module
    parent_id: intensify-module
    lifecycle_state: active
    provenance: analyzed
    intent:
      summary: Lets the CLI run as `python -m intensify`.
      rationale: The MCP stdio test and some agents launch the server through the interpreter rather than a console script.
      author: ai
    technical:
      language: python
      location: {path: src/intensify/__main__.py}
      complexity: {loc: 4}
      fingerprint: sha256:446f5e605ca4583623106b7a59585ead82d0472ed23ec8d23c0a51e7ff016dff
  - id: intensify.cli
    kind: module
    parent_id: intensify-module
    lifecycle_state: active
    provenance: analyzed
    intent:
      summary: Typer command-line interface; each command lives in its own module and is registered here.
      rationale: 'The CLI is the outermost layer: library modules never import it, so the same logic serves the CLI, the MCP server and tests.'
      author: ai
    technical:
      language: python
      location: {path: src/intensify/cli/__init__.py}
      complexity: {loc: 61}
      fingerprint: sha256:cd0a6c80a84743c57ecfebabd12332246a2a22460b55d1d7556897fb35acbe7d
    governance:
      invariants:
        - id: outermost-layer
          text: Only the CLI itself, __main__ and tests depend on CLI code; library modules never do.
          rule:
            allowed_dependents:
              from: [intensify.cli*, intensify.__main__, tests.*]

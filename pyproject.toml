[project]
name = "intensify"
version = "0.1.0"
description = "Intent-driven codebase architecture: define, visualize, and enforce the intent of your code."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Intensify contributors" }]
keywords = ["architecture", "knowledge-graph", "static-analysis", "drift-detection", "ai-agents", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "pathspec>=1.1.1",
    "pydantic>=2.14.4",
    "ruamel-yaml>=0.19.1",
    "tree-sitter>=0.26.1",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.29.2",
]

[project.urls]
Homepage = "https://github.com/Optimum-Communication/intensify"
Issues = "https://github.com/Optimum-Communication/intensify/issues"

[project.scripts]
intensify = "intensify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intensify"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "intensify/_skills"  # bundled AI skills; see intensify.skills

[tool.hatch.build.targets.sdist]
include = ["src/intensify", "spec", "skills", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures/repos"]  # sample code for the analyzers, not project code
force-exclude = true  # also when pre-commit passes file names explicitly

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PL"]
ignore = [
    "PLR0913",
    "PLR0917",  # Typer commands take one parameter per CLI option
]

[tool.ruff.lint.pylint]
max-branches = 16

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"src/intensify/spec/models.py" = ["E501"]  # generated

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
exclude = ["^tests/fixtures/repos/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.98.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-jsonschema>=4.26.0.20261006",
]
